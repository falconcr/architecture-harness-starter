# Generador de carga: sin trafico, el analisis del canary no tiene datos que mirar
# y el gate decide a ciegas. Esto es parte del harness, no un adorno de la demo.
#
# Pega a /orders y a POST /orders a traves del Service, asi el reparto 80/20 de
# replicas se traduce en trafico real sobre el pod canary.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-loadgen
  labels:
    app.kubernetes.io/name: orders-loadgen
    app.kubernetes.io/part-of: harness-starter
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-loadgen
        app.kubernetes.io/part-of: harness-starter
        app.kubernetes.io/managed-by: argocd
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: busybox:1.37.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "generando carga contra http://orders/ ..."
              while true; do
                wget -q -O /dev/null -T 2 "http://orders/orders" || true
                wget -q -O /dev/null -T 2 --post-data \
                  '{"customerId":"cust_demo","lines":[{"sku":"SKU-001","quantity":1,"unitPriceCents":1000}]}' \
                  --header 'Content-Type: application/json' \
                  "http://orders/orders" || true
                sleep 0.2
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
