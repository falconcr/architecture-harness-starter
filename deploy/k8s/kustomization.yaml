# Argo CD sincroniza este directorio. Cambiar algo aca ES desplegar.
#
# El tag de la imagen se cambia con:
#   kustomize edit set image orders=orders:v2-bug
# ...y se despliega commiteando el cambio. No hay otra via al cluster (ADR-003).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - service.yaml
  - analysistemplate.yaml
  - rollout.yaml
  - loadgen.yaml
